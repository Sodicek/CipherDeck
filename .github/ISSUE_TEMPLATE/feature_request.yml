name: Feature request
description: Suggest a cipher, learning tool, or usability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Explain the use case or problem behind the request.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution
      description: Describe how you imagine the feature working.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cipher algorithm
        - Learn Mode
        - Frequency analysis
        - User interface
        - Import or export
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
