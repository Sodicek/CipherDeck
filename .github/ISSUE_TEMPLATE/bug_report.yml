name: Bug report
description: Report a reproducible problem in CipherDeck
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CipherDeck.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select ...
        2. Enter ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CipherDeck version
      placeholder: v0.6.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or other useful details. Do not include sensitive text or keys.
