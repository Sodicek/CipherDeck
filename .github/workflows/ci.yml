name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CipherDeck.sln

      - name: Build
        run: dotnet build CipherDeck.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CipherDeck.sln --configuration Release --no-build
