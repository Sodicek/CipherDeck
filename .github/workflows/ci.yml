name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run platform-independent tests
        run: dotnet test CipherDeck.Core.Tests/CipherDeck.Core.Tests.csproj --configuration Release

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CipherDeck.sln

      - name: Build
        run: dotnet build CipherDeck.sln --configuration Release --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format CipherDeck.sln --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test CipherDeck.sln --configuration Release --no-build

      - name: Build portable and installer packages
        shell: pwsh
        run: ./scripts/Build-ReleasePackages.ps1
